version: 2
models:
  - name: product_cost_history
    columns:
      - name: sku
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: unit_cost_sar
        tests: [not_null]
      - name: is_current
        tests: [not_null]
  - name: weekly_margin
    columns:
      - name: iso_week
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: category
        tests: [not_null]
  - name: price_quarantine
    columns:
      - name: reason
        tests:
          - accepted_values:
              values: ['unknown_sku', 'invalid_cost']
